name: caps_finals
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  # Using the recommended range format
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  
  # Core App Dependencies
  flutter_dotenv: ^6.0.0
  supabase_flutter: ^2.10.3
  
  # Moved here from dev_dependencies: These are required for runtime functionality (file picking, path resolution)
  file_picker: ^10.3.6
  path: ^1.8.3
  google_fonts: ^6.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # Maps & location (Phase 1 — store locator)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

  # PayMongo in-app checkout WebView
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/banner image/Quickcartfinallogo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/quickcartwhitelogo.png
    - assets/img/
    - assets/img/categories/
    - assets/img/banner image/